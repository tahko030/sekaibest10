<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#07101f">
    <title>歌曲二選一｜プロセカ 書き下ろし楽曲</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <header class="site-header site-shell">
      <a class="brand" href="./index.html" aria-label="返回首頁並保留進度">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>MY SEKAI SORTER</span>
      </a>
      <a class="button button-secondary" href="./results.html">查看目前結果</a>
    </header>

    <main class="page-main site-shell">
      <section class="page-heading">
        <div class="sorter-title-wrap">
          <h1 class="page-title sorter-page-title">プロセカ書下曲 二選一</h1>
        </div>
        <div class="progress-card">
          <div class="progress-meta">
            <strong id="progress-stage">全曲比較</strong>
            <span id="progress-detail">0 / 176 題</span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="排序進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>
      </section>

      <section class="duel-grid" aria-label="歌曲二選一">
        <article class="song-card" id="left-card">
          <div class="video-frame">
            <div id="left-player" aria-label="左側歌曲 YouTube 播放器"></div>
          </div>
          <div class="song-info">
            <span class="song-unit" id="left-unit"></span>
            <h2 class="song-title" id="left-title"></h2>
            <p class="song-meta" id="left-meta"></p>
          </div>
          <button class="choice-button" id="left-choose" type="button">選這首</button>
        </article>

        <button class="button button-secondary mobile-skip" id="mobile-skip-button" type="button">跳過這組</button>

        <article class="song-card" id="right-card">
          <div class="video-frame">
            <div id="right-player" aria-label="右側歌曲 YouTube 播放器"></div>
          </div>
          <div class="song-info">
            <span class="song-unit" id="right-unit"></span>
            <h2 class="song-title" id="right-title"></h2>
            <p class="song-meta" id="right-meta"></p>
          </div>
          <button class="choice-button" id="right-choose" type="button">選這首</button>
        </article>
      </section>

      <div class="sorter-controls">
        <button class="button button-secondary desktop-skip" id="skip-button" type="button">跳過這組</button>
        <button class="button button-secondary" id="undo-button" type="button">上一題</button>
        <a class="button button-secondary" href="./index.html">暫停並返回首頁</a>
      </div>
      <p class="status-message" id="sorter-status" aria-live="polite"></p>
    </main>

    <script src="./js/songs.js?v=20261103-2"></script>
    <script src="./js/common.js?v=20261103-2"></script>
    <script src="./js/sorter.js?v=20261103-3"></script>
  </body>
</html>
